packages:
  pacman:
    # build essentials
    - base-devel
    - git
    - openssh
    - curl
    - wget
    - unzip
    - less
    - chezmoi

    # desktop: niri + noctalia
    - niri
    - noctalia
    - xwayland-satellite
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - capitaine-cursors
    - wl-clipboard
    - adw-gtk-theme

    # noctalia widget / plugin dependencies
    - cava
    - networkmanager
    - bluez
    - bluez-utils
    - pavucontrol
    - tailscale
    - polkit

    # terminal & shell
    - alacritty
    - fish

    # editors
    - neovim
    - zed

    # GUI apps
    - nautilus
    - gnome-keyring

    # system monitoring
    - btop
    - fastfetch

    # dev tools
    - lazygit
    - github-cli
    - docker
    - docker-buildx
    - lazydocker
    - opencode

    # CLI essentials
    - fzf
    - eza
    - bat
    - ripgrep
    - fd
    - jq
    - tldr

    # fonts
    - ttf-jetbrains-mono-nerd
    - noto-fonts
    - noto-fonts-emoji

    # misc system
    - xdg-utils

    # extra apps / dev tools
    - qmk
    - virt-manager
    - shellcheck
    - obsidian

  pacman_laptop:
    - upower
    - power-profiles-daemon

  pacman_cachyos:
    - cachyos-niri-noctalia
    - cachyos-alacritty-config
    - zen-browser-bin
    - claude-code
    - yay
    - localsend

  aur:
    - cliamp
    - fetch-git
